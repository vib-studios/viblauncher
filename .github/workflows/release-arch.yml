# Build the Arch package and publish it to a pacman repository on GitHub Pages.
#
# What this produces is the framework-dependent package from packaging/arch:
# /usr/lib/viblauncher plus a wrapper on PATH, depending on
# dotnet-runtime-10.0 rather than shipping a second copy of the runtime. That is
# deliberate, and it is why the package is not produced by the Release workflow
# that builds the self-contained tarballs - the two ship different things on
# purpose, for users who are not on Arch.
#
# A pacman repo is a directory of .pkg.tar.zst files plus a database that
# repo-add builds from them. pacman fetches all three (package, .db, .files)
# over plain HTTPS, so GitHub Pages is enough and no AUR account is involved.
# Everything is served from a subpath of this repo's Pages site, so it is a
# sibling of the tarballs rather than a separate place to look.

# This workflow does not deploy Pages at all, so nothing needs enabling here.
# A repository Pages site in this org resolves to the apex domain
# vibstudios.space, which belongs to the site repository (vib-studios.github.io),
# so deploying from here would either fail or write into the wrong site. The
# pacman database is built and served by the Pacman repository workflow in the
# site repository, which owns the domain. See the note on the release job below.
name: Arch package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: read

# The Release workflow publishes the same tags at the same time and writes a
# different release; this one builds the packages and attaches them. Neither
# cancels the other, so the group is per-ref rather than shared.
concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # The PKGBUILD pins pkgver and the source is a tag, so a stale pkgver would
  # either build the previous release or fail to find the tag. Both are worth
  # catching before a package is published under a version that says otherwise.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Same reasoning as the Release workflow: the tag reaches the script
      # through the environment, so a tag name is never pasted into the shell.
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          pkgver=$(sed -n 's:^pkgver=::p' packaging/arch/PKGBUILD)
          if [ "$version" != "$declared" ]; then
            echo "tag $tag does not match <Version>$declared</Version> in Directory.Build.props" >&2
            exit 1
          fi
          if [ "$version" != "$pkgver" ]; then
            echo "tag $tag does not match pkgver=$pkgver in packaging/arch/PKGBUILD" >&2
            echo "bump pkgver (and pkgrel) before tagging, or the package lies about its version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    # makepkg refuses to run as root, so the whole job runs as a normal user in
    # an Arch container rather than being run as a normal user on an Ubuntu
    # runner. The container is the only place the Arch toolchain is correct.
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Update system
        run: pacman -Syu --noconfirm

      # makepkg refuses to build when a declared runtime dependency is absent,
      # and base-devel does not include any of these. Installing them is only
      # to satisfy that check on the build host; what ends up in the package is
      # unchanged, because the package is framework-dependent and depends on
      # dotnet-runtime-10.0 rather than shipping it.
      - name: Install package dependencies
        run: |
          # The runtime set the PKGBUILD declares, so makepkg's dependency
          # check passes, plus the makedepends (dotnet-sdk-10.0 for the build,
          # git because the PKGBUILD sources the repository over https).
          pacman -S --noconfirm --needed \
            dotnet-runtime-10.0 \
            dotnet-sdk-10.0 \
            java-runtime \
            fontconfig \
            libx11 \
            libice \
            libsm \
            git

      - name: Configure makepkg for CI
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          useradd -m builder
          chown -R builder:builder .
          # makepkg reads the PKGBUILD from the current directory and builds
          # alongside it, so the work happens in packaging/arch. The PKGBUILD
          # clones the repository itself into $srcdir, so the checkout outside
          # that directory is only used for the PKGBUILD itself.
          cd packaging/arch
          chown -R builder:builder .
          # The package must be built for the architecture the user will run it
          # on, and the runner is x86_64, so aarch64 is cross-compiled.
          #
          # ARCH is the documented way to tell makepkg the target, and it is
          # required, but it is not sufficient on an x86_64 host: it tells
          # makepkg it may produce a package for that arch, while $CARCH inside
          # the PKGBUILD still resolves to the host's x86_64. Without CARCH
          # forced as well, the case statement in build() takes the x86_64
          # branch, publishes for linux-x64, and names the file -x86_64. That is
          # a package that installs on aarch64 and then cannot execute, so both
          # variables have to be set.
          runuser -u builder -- env ARCH="$TARGET_ARCH" CARCH="$TARGET_ARCH" makepkg -f

      # Named so the artifact is self-describing: the pages job below globs
      # these rather than whatever happens to be in the working tree.
      - name: Collect package
        id: collect
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          # makepkg ran in packaging/arch, so the package lands there.
          found=0
          for pkg in packaging/arch/*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            base=$(basename "$pkg")
            # The filename carries the architecture, so it is the check: a job
            # asked for aarch64 that produced an x86_64 package must fail here
            # rather than publish a package that cannot run on the target.
            case "$base" in
              *-"$TARGET_ARCH".pkg.tar.zst) ;;
              *) echo "expected a $TARGET_ARCH package, got $base" >&2; exit 1 ;;
            esac
            cp "$pkg" out/
            echo "package=$base" >> "$GITHUB_OUTPUT"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "makepkg produced no package" >&2
            exit 1
          fi
          ls -l out/

      # Attached to the release as well as the pacman repo, so someone who
      # arrived from a release page and is on Arch does not have to go looking.
      - uses: actions/upload-artifact@v7
        with:
          name: viblauncher-pkg-${{ matrix.arch }}
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  # There is deliberately no Pages deployment here. A repository Pages site in
  # this org resolves to the apex domain vibstudios.space, which belongs to the
  # site repository (vib-studios.github.io), so deploying from here either fails
  # or writes into the wrong site. The pacman database is built by the Pacman
  # repository workflow in the site repository, which owns the domain, and it
  # reads the packages off the release this workflow attaches them to.

  release:
    name: Attach to release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # One download per architecture, named explicitly, rather than a pattern
      # with merge-multiple. With the pattern, both artifacts were fetched but
      # only the x86_64 package landed in the directory, and the release
      # published an x86_64-only package set that looked complete. Addressing
      # each artifact by name cannot silently drop one.
      - uses: actions/download-artifact@v8
        with:
          name: viblauncher-pkg-x86_64
          path: packages/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: viblauncher-pkg-aarch64
          path: packages/aarch64

      - name: Flatten the package directories
        run: |
          set -euo pipefail
          find packages -mindepth 2 -name '*.pkg.tar.zst' -exec mv -t packages {} +
          rmdir packages/x86_64 packages/aarch64
          ls -l packages

      # Both architectures have to be here before anything is uploaded. A
      # release that carries only x86_64 looks complete, and an aarch64 user
      # installing from it gets "no packages match" rather than a clear reason.
      - name: Verify both architectures are present
        env:
          EXPECTED: 'x86_64 aarch64'
        run: |
          set -euo pipefail
          ls -l packages
          for arch in $EXPECTED; do
            if ! ls packages/ | grep -q -- "-${arch}\.pkg\.tar\.zst$"; then
              echo "no package for $arch in the downloaded artifacts" >&2
              exit 1
            fi
          done
          echo "both architectures present"

      # The release is created as a draft by the Release workflow, which runs on
      # the same tag. If this runs first there is nothing to attach to yet, so
      # wait rather than publishing a second release for the same tag.
      - name: Attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" packages/*.pkg.tar.zst --clobber
              exit 0
            fi
            sleep 10
          done
          echo "release $TAG did not appear within 5 minutes; skipping" >&2
